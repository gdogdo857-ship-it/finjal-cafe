<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#211812">
  <meta name="description" content="Connect with FINJAL CAFE on Instagram, Snapchat and TikTok.">
  <title>FINJAL CAFE | Connect With Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #493326 0%, transparent 55%),
        #211812;
      color: #f7eee3;
      font-family: "DM Sans", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 20px;
    }
    .container {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }
    .logo {
      width: 104px;
      height: 104px;
      border: 1px solid rgba(230, 202, 163, 0.65);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #e6caa3;
      font-family: "Playfair Display", serif;
      font-size: 43px;
      letter-spacing: -3px;
      background: rgba(255, 255, 255, 0.035);
      box-shadow: 0 0 45px rgba(230, 202, 163, 0.08);
    }
    .eyebrow {
      color: #d0ad80;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 5px;
      margin-bottom: 14px;
    }
    h1 {
      font-family: "Playfair Display", serif;
      font-size: 35px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .description {
      color: #c4b5a6;
      font-size: 13px;
      line-height: 1.8;
      margin-bottom: 32px;
    }
    .divider {
      width: 38px;
      height: 1px;
      background: #c6a176;
      margin: 0 auto 30px;
    }
    .social-links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .social-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 67px;
      padding: 15px 19px;
      border: 1px solid rgba(230, 202, 163, 0.22);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.045);
      color: #f7eee3;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
      text-align: left;
    }
    .social-button:hover {
      background: rgba(230, 202, 163, 0.12);
      transform: translateY(-2px);
    }
    .social-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .icon {
      width: 37px;
      height: 37px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1e4d2;
      color: #302219;
      font-size: 18px;
      font-weight: 700;
    }
    .social-name {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .social-handle {
      display: block;
      color: #b9a99a;
      font-size: 11px;
    }
    .arrow {
      color: #c6a176;
      font-size: 21px;
    }
    .footer {
      margin-top: 37px;
      color: #8f7c6c;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    @media (max-width: 360px) {
      h1 {
        font-size: 30px;
      }
      .social-button {
        padding: 13px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .social-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo" aria-label="Finjal Cafe monogram">F.</div>
    <p class="eyebrow">Coffee · Moments · Connection</p>
    <h1>FINJAL CAFE</h1>
    <p class="description">
      Your coffee moment starts here.<br>
      Follow us and stay connected.
    </p>
    <div class="divider"></div>
    <nav class="social-links" aria-label="Finjal Cafe social media">
      <a class="social-button"
         href="https://www.instagram.com/finjalcafe/"
         target="_blank"
         rel="noopener noreferrer">
        <span class="social-info">
          <span class="icon" aria-hidden="true">◎</span>
          <span>
            <span class="social-name">Instagram</span>
            <span class="social-handle">@finjalcafe</span>
          </span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="social-button"
         href="https://www.snapchat.com/@finjal.cafe"
         target="_blank"
         rel="noopener noreferrer">
        <span class="social-info">
          <span class="icon" aria-hidden="true">👻</span>
          <span>
            <span class="social-name">Snapchat</span>
            <span class="social-handle">@finjal.cafe</span>
          </span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="social-button"
         href="https://www.tiktok.com/@finjal.cafe"
         target="_blank"
         rel="noopener noreferrer">
        <span class="social-info">
          <span class="icon" aria-hidden="true">♪</span>
          <span>
            <span class="social-name">TikTok</span>
            <span class="social-handle">@finjal.cafe</span>
          </span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <footer class="footer">
      FINJAL CAFE · SEE YOU OVER COFFEE
    </footer>
  </main>
</body>
</html>
